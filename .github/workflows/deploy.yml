name: Deploy web app to STRATO

# Uploads web/ to your STRATO webspace via SFTP, writes config.php from the
# repository secrets and creates/updates the database tables.
# Runs on every change to web/ and can be started by hand (Actions -> Run workflow).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

concurrency:
  group: optcg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
      SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OPT_API_TOKEN: ${{ secrets.OPT_API_TOKEN }}
      OPT_API_URL: ${{ secrets.OPT_API_URL }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REMOTE_DIR: ${{ vars.REMOTE_DIR || 'website/opwatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that all secrets are set
        run: |
          missing=""
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD DB_HOST DB_NAME DB_USER DB_PASS ADMIN_PASSWORD OPT_API_TOKEN OPT_API_URL MAIL_FROM; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          if [ ${#OPT_API_TOKEN} -lt 32 ]; then echo "::error::OPT_API_TOKEN must be at least 32 characters"; exit 1; fi
          if [ ${#ADMIN_PASSWORD} -lt 10 ]; then echo "::error::ADMIN_PASSWORD must be at least 10 characters"; exit 1; fi

      - name: Write config.php
        run: |
          command -v php >/dev/null || sudo apt-get install -y -qq php-cli >/dev/null
          php -r '
            $hash = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            $c = "<?php\n// Generated by the deploy workflow - edit the GitHub secrets instead.\n";
            foreach (["DB_HOST","DB_NAME","DB_USER","DB_PASS","API_TOKEN"=>"OPT_API_TOKEN","MAIL_FROM"] as $k => $env) {
              $name = is_int($k) ? $env : $k;
              $c .= "const $name = " . var_export((string)getenv($env), true) . ";\n";
            }
            $c .= "const ADMIN_PASSWORD_HASH = " . var_export($hash, true) . ";\n";
            $c .= "const APP_TIMEZONE = \"Europe/Berlin\";\n";
            file_put_contents("web/config.php", $c);
          '
          php -l web/config.php

      - name: Upload to STRATO via SFTP
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            mkdir -p -f $REMOTE_DIR;
            mirror -R --verbose=1 --exclude-glob install.php --exclude-glob config.sample.php web/ $REMOTE_DIR;
            bye"

      - name: Create / update database tables
        run: |
          url="${OPT_API_URL%/}/api/setup.php"
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST -H "Authorization: Bearer $OPT_API_TOKEN" "$url" 2>curl.err || true)
          touch resp.json
          cat resp.json || true; echo
          if [ "$code" != "200" ] || ! grep -q '"ok":true' resp.json; then
            hostpart="${OPT_API_URL#*://}"; pathpart="/${hostpart#*/}"; [ "$pathpart" = "/$hostpart" ] && pathpart="(none)"
            echo "::warning title=Address used::path after the domain = '$pathpart', total length ${#OPT_API_URL}, upload folder = '$REMOTE_DIR'"
            if grep -qi "domain reserved" resp.json; then
              echo "::error title=Domain not connected::$url shows the STRATO 'Domain reserved' page. Connect the domain to your webspace in the STRATO login (Domains -> Domainverwaltung)."
            else
              echo "::error title=Setup failed::$url returned HTTP $code: $(cat curl.err) $(head -c 400 resp.json | tr '\n' ' '). Check OPT_API_URL, REMOTE_DIR and the database secrets."
            fi
            exit 1
          fi
          echo "::notice title=Setup done::$(cat resp.json)"
          echo "Done - open ${OPT_API_URL%/}/ and log in with your ADMIN_PASSWORD."
