name: OPTCG preorder check

# Every 45 minutes. Cron cannot express "every 45 min" directly, so the
# 3-hour pattern 00:00, 00:45, 01:30, 02:15 is repeated (times are UTC).
# Note: GitHub may start scheduled runs a few minutes late under load.
on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "45 */3 * * *"
    - cron: "30 1-23/3 * * *"
    - cron: "15 2-23/3 * * *"
  workflow_dispatch: {}

concurrency:
  group: optcg-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape shops and send results to the web app
        env:
          OPT_API_URL: ${{ secrets.OPT_API_URL }}
          OPT_API_TOKEN: ${{ secrets.OPT_API_TOKEN }}
        run: |
          if [ -z "$OPT_API_URL" ] || [ -z "$OPT_API_TOKEN" ]; then
            echo "Not set up yet (secrets OPT_API_URL / OPT_API_TOKEN missing) - skipping."; exit 0
          fi
          set -o pipefail
          if ! python scraper/main.py 2>&1 | tee scrape.log; then
            echo "::error title=Scraper failed::$(tail -n 12 scrape.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          echo "::notice title=Result::$(grep -E '^(Checking|Done:|Ingest:)' scrape.log | tr '\n' ' ' | cut -c1-1500)"
          fails=$(grep -E '\] ERR ' scrape.log | cut -c1-160 | head -n 40 | tr '\n' '~' | sed 's/~/ || /g')
          [ -z "$fails" ] || echo "::warning title=Failed shops::$fails"
